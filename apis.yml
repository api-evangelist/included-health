aid: included-health
name: Included Health
description: 'Included Health is a healthcare company that delivers personalized virtual
  care and healthcare navigation to members through their employers and health plans.
  The platform combines virtual primary, urgent, behavioral, and specialty care with
  a 24/7 Care Team that handles benefits navigation, provider matching, billing and
  claims advocacy, and expert medical opinions. Sold B2B to employers, health plans,
  labor and trust organizations, and the public sector, Included Health surfaced in
  the API Evangelist network as a Greylock portfolio company; it publishes no public
  developer portal, API documentation, or well-known discovery surface, so this profile
  captures company identity and live domain-security posture rather than an API contract.'
